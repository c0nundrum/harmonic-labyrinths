<header class="site-header">
  <div class="site-header__inner wide-column">
    <a class="site-title" href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>{{ site.Title }}</a>
    {{- with site.Menus.main }}
    <nav class="site-nav" aria-label="Main">
      <ul>
        {{- range . }}
        <li><a href="{{ .URL }}"
          {{- if $.IsMenuCurrent "main" . }} aria-current="page"
          {{- else if $.HasMenuCurrent "main" . }} aria-current="true"
          {{- end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
    {{- end }}
  </div>
</header>

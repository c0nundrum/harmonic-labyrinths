<footer class="site-footer">
  <div class="site-footer__inner wide-column">
    <p>{{ site.Title }}</p>
    <ul>
      {{- with site.Params.source }}
      <li><a href="{{ . }}">Source</a></li>
      {{- end }}
      {{- with site.Home.OutputFormats.Get "rss" }}
      <li><a href="{{ .RelPermalink }}">RSS</a></li>
      {{- end }}
    </ul>
  </div>
</footer>

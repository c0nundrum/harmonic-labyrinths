{{ define "main" }}
<div class="page grid">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{- with .Description }}
    <p class="lead">{{ . }}</p>
    {{- end }}
  </header>
  {{- with .Pages }}
  <ul class="terms">
    {{- range .ByTitle }}
    <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a><span class="count">{{ len .Pages }}</span></li>
    {{- end }}
  </ul>
  {{- else }}
  <p class="empty">Nothing here yet.</p>
  {{- end }}
</div>
{{ end }}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-labelledby="loop-title">
  <title id="loop-title">A three-stage loop: read, transform, and write, with write feeding back into read.</title>
  <g font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#161616">
    <rect x="40" y="60" width="140" height="56" fill="#ffffff" stroke="#161616"/>
    <text x="110" y="93" text-anchor="middle">Read</text>
    <rect x="250" y="60" width="140" height="56" fill="#f4f4f4" stroke="#161616"/>
    <text x="320" y="93" text-anchor="middle">Transform</text>
    <rect x="460" y="60" width="140" height="56" fill="#ffffff" stroke="#0f62fe" stroke-width="2"/>
    <text x="530" y="93" text-anchor="middle">Write</text>
  </g>
  <g stroke="#161616" fill="none" stroke-width="1.5">
    <path d="M180 88 H244"/><path d="M238 82 L246 88 L238 94"/>
    <path d="M390 88 H454"/><path d="M448 82 L456 88 L448 94"/>
    <path d="M530 116 V160 H110 V122" stroke="#0f62fe"/><path d="M104 128 L110 120 L116 128" stroke="#0f62fe"/>
  </g>
</svg>

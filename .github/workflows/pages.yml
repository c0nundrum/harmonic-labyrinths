# Build, check, and deploy the site to GitHub Pages.
#
# Every push and pull request runs tools/check.sh (build with warnings as
# errors, XML validity, internal links, accessibility). Only pushes to main
# deploy. Tool versions are pinned here and in tools/check.sh.

name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.167.0
  HTMLTEST_VERSION: 0.17.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Hugo
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          deb="hugo_${HUGO_VERSION}_linux-amd64.deb"
          curl -fsSLO "$base/$deb"
          curl -fsSL "$base/hugo_${HUGO_VERSION}_checksums.txt" | grep " $deb\$" | sha256sum -c -
          sudo dpkg -i "$deb"
          hugo version

      - name: Install htmltest
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL "https://github.com/wjdp/htmltest/releases/download/v${HTMLTEST_VERSION}/htmltest_${HTMLTEST_VERSION}_linux_amd64.tar.gz" | tar xz htmltest
          sudo mv htmltest /usr/local/bin/
          htmltest --version

      - name: Build and check
        run: tools/check.sh

      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

# Harmonic Labyrinths — Hugo configuration.
# Durable rules live in README.md, DESIGN.md, and docs/CONTENT.md.

# Production URL; CI builds and checks with exactly this value. If the site
# moves to a custom domain, change it here (see docs/ROADMAP.md).
baseURL = "https://c0nundrum.github.io/harmonic-labyrinths/"
locale = "en"
title = "Harmonic Labyrinths"
enableRobotsTXT = true
# Keep section and taxonomy titles exactly as authored ("ai", not "Ai").
capitalizeListTitles = false
# Sentence case for generated titles (DESIGN.md §3).
titleCaseStyle = "firstupper"

[module.hugoVersion]
  min = "0.167.0"
  extended = false

# Essays live at the site root (/context-is-not-memory/); notes under /notes/.
# The slug is the file or bundle name unless `slug` is set in front matter.
[permalinks.page]
  writing = "/:slugorcontentbasename/"
  notes = "/notes/:slugorcontentbasename/"

[params]
  description = "A personal site for deep technical and intellectual writing."
  source = "https://github.com/c0nundrum/harmonic-labyrinths"

[taxonomies]
  tag = "tags"
  series = "series"

# Authors write `updated:` as documented in docs/CONTENT.md.
[frontmatter]
  lastmod = ["updated", "lastmod", "date"]

# Highlighting emits classes; colors come from assets/css, not inline styles.
[markup.highlight]
  noClasses = false
  # Line numbers inline (and unselectable), so highlighted lines span the number too.
  lineNumbersInTable = false

# Images alone on a line render as <figure> (layouts/_markup/render-image.html).
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

# Mathematics: TeX between these delimiters is rendered at build time by
# layouts/_markup/render-passthrough.html. No math JavaScript ships.
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [["\\[", "\\]"], ["$$", "$$"]]
    inline = [["\\(", "\\)"], ["$", "$"]]

# Feeds: the site, each section, and each tag or series. Not the tag index.
[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]
  taxonomy = ["html"]
  term = ["html", "rss"]

[services.rss]
  limit = 20

# Block attributes, e.g. {.dialogue} after a definition list (docs/CONTENT.md).
[markup.goldmark.parser.attribute]
  block = true
